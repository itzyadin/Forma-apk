plugins {
    id 'com.android.application'
}

android {
    namespace 'app.forma.tracker'
    compileSdk 34

    defaultConfig {
        applicationId 'app.forma.tracker'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Same key every build, so new APKs install over the old one and the site's assetlinks.json keeps matching.
    signingConfigs {
        forma {
            storeFile file('../signing/forma-debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.forma
        }
        release {
            signingConfig signingConfigs.forma
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
