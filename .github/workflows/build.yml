name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Show the tools GitHub gives us (for troubleshooting)
        run: |
          java -version
          gradle --version | head -n 8
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/debug/app-debug.apk Forma.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Forma-apk
          path: Forma.apk
